name: ASM & C

on:
  push:
    branches: [ "main", "dev", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-codeql:
    name: Lint (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c
        build-mode: none

    - name: Analyze code
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:actions"

  build:
    name: Build ${{ matrix.name }} for target x86_64 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            os: ubuntu-latest
            configure-preset: x86_64-debug
            build-preset: x86_64-debug
          - name: release
            os: ubuntu-latest
            configure-preset: x86_64-release
            build-preset: x86_64-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install cmake make build-essential bison flex libgmp3-dev libisl-dev libmpc-dev libmpfr-dev texinfo ovmf dosfstools mtools parted -y
        if: ${{ matrix.os == 'ubuntu-latest' }}

      # TODO: Install cross compiler

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }} --parallel

