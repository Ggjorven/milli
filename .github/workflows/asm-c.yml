name: ASM & C

on:
  push:
    branches: [ "main", "dev", "feature/**", "fix/**" ]
    paths:
      - ".github/workflows/asm-c.yml"
      - "boot/**"
      - "initrd/**"
      - "kernel/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - ".github/workflows/asm-c.yml"
      - "boot/**"
      - "initrd/**"
      - "kernel/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"

jobs:
  lint-codeql:
    name: Lint (CodeQL)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c
        build-mode: none

    - name: Analyze code
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:actions"

  build:
    name: Build ${{ matrix.name }} for target x86_64 with ${{ matrix.bootloader-name }} bootloader on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            os: ubuntu-24.04
            configure-preset: x86_64-debug
            build-preset: x86_64-debug
            bootloader: bios
            bootloader-name: BIOS
          - name: release
            os: ubuntu-24.04
            configure-preset: x86_64-release
            build-preset: x86_64-release
            bootloader: bios
            bootloader-name: BIOS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake make build-essential bison flex \
            libgmp3-dev libisl-dev libmpc-dev libmpfr-dev texinfo curl \
            dosfstools mtools parted qemu-system-x86
        if: ${{ matrix.os == 'ubuntu-24.04' }}

      - name: Restore cross-compiler cache
        id: cross-compiler-cache
        uses: actions/cache@v6
        with:
          path: ~/opt/cross-compilers
          key: cross-compiler-x86_64-${{ matrix.os }}-${{ hashFiles('scripts/build-cross-compiler.sh') }}

      - name: Build cross-compiler
        if: steps.cross-compiler-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-cross-compiler.sh
          ./scripts/build-cross-compiler.sh --arch x86_64 --install-location "$HOME/opt/cross-compilers" --source-dir "$HOME/src/cross-compilers"

      - name: Add compiler to PATH
        run: echo "$HOME/opt/cross-compilers/bin" >> "$GITHUB_PATH"

      - name: Verify cross-compiler exists
        run: x86_64-elf-gcc --version

      - name: Configure CMake
        run: cmake --preset ${{ matrix.configure-preset }} -DRUN_HEADLESS=ON -DBOOTLOADER=${{ matrix.bootloader }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }} --parallel

      - name: Upload configured build tree
        uses: actions/upload-artifact@v7
        with:
          name: milli-build-x86_64-${{ matrix.name }}
          path: build/${{ matrix.configure-preset }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

